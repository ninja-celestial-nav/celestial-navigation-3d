<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="天文航海 3D 互動學習系統 - 透過 PZS 球面三角形理解天文定位計算">
  <title>天文航海 3D 學習系統 | Celestial Navigation</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' },
      startup: { typeset: true }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Welcome Overlay -->
  <div id="welcome-overlay">
    <div class="welcome-card">
      <div class="welcome-icon">🌌</div>
      <h1>天文航海 3D 學習系統</h1>
      <p>
        透過互動式 3D 天球模型，逐步理解天文導航中<br>
        <strong>PZS 球面三角形</strong>的計算原理與截距法定位。
      </p>
      <button class="start-btn" id="btn-start" onclick="startApp()">開始探索 →</button>
    </div>
  </div>

  <div id="app-container">
    <!-- Top Header -->
    <header id="top-header">
      <div class="logo">
        <div class="logo-icon">🧭</div>
        <span class="logo-text">天文航海 3D 學習系統</span>
      </div>
      <div class="phase-tabs" id="phase-tabs">
        <button class="phase-tab active" data-phase="0" onclick="switchPhase(0)">
          <span class="tab-num">01</span> 確立 3D 位置
        </button>
        <button class="phase-tab" data-phase="1" onclick="switchPhase(1)">
          <span class="tab-num">02</span> 解算 PZS 三角形
        </button>
        <button class="phase-tab" data-phase="2" onclick="switchPhase(2)">
          <span class="tab-num">03</span> 截距法投影
        </button>
        <button class="phase-tab" data-phase="3" onclick="switchPhase(3)">
          <span class="tab-num">04</span> 例題測驗
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div id="main-content">
      <!-- 3D Viewport -->
      <div id="viewport">
        <div id="labels-container"></div>
        <div class="viewport-info">
          <div class="info-badge">
            <span class="dot"></span>
            <span>3D 天球模型 · 可拖曳旋轉</span>
          </div>
        </div>

        <!-- Calculation Results -->
        <div class="calc-results" id="calc-results">
          <div class="calc-card">
            <div class="calc-label">計算高度 Hc</div>
            <div class="calc-value" id="val-hc">--°</div>
          </div>
          <div class="calc-card">
            <div class="calc-label">觀測高度 Ho</div>
            <div class="calc-value gold" id="val-ho">--°</div>
          </div>
          <div class="calc-card">
            <div class="calc-label">截距 I</div>
            <div class="calc-value green" id="val-intercept">-- nm</div>
          </div>
          <div class="calc-card">
            <div class="calc-label">方位角 Zn</div>
            <div class="calc-value magenta" id="val-zn">--°</div>
          </div>
        </div>
      </div>

      <!-- Right Sidebar -->
      <div id="sidebar">
        <div class="sidebar-header" id="sidebar-header">
          <h2>階段一：確立 3D 絕對位置</h2>
          <div class="phase-desc">確定天體在空間中的絕對位置和觀測者在當地的實際角度</div>
        </div>

        <div class="step-indicator" id="step-indicator">
          <!-- Dots generated by JS -->
        </div>

        <div class="sidebar-content" id="sidebar-content">
          <!-- Step content rendered by JS -->
        </div>

        <!-- Controls -->
        <div class="controls-section" id="controls-section">
          <h4>互動參數控制</h4>
          <div class="control-row">
            <label>觀測者緯度 φ</label>
            <input type="range" id="ctrl-lat" min="-80" max="80" value="25" step="1">
            <span class="value-display" id="disp-lat">25°N</span>
          </div>
          <div class="control-row">
            <label>觀測者經度 λ</label>
            <input type="range" id="ctrl-lon" min="-180" max="180" value="121" step="1">
            <span class="value-display" id="disp-lon">121°E</span>
          </div>
          <div class="control-row">
            <label>天體赤緯 δ</label>
            <input type="range" id="ctrl-dec" min="-70" max="70" value="20" step="1">
            <span class="value-display" id="disp-dec">20°N</span>
          </div>
          <div class="control-row">
            <label>格林威治時角</label>
            <input type="range" id="ctrl-gha" min="0" max="360" value="300" step="1">
            <span class="value-display" id="disp-gha">300°</span>
          </div>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
          <button class="nav-btn" id="btn-prev" onclick="prevStep()">← 上一步</button>
          <button class="nav-btn primary" id="btn-next" onclick="nextStep()">下一步 →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
